default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: library_app_development
  username: postgres
  password: password
  host: localhost
  port: 5432

test:
  <<: *default
  database: library_app_test
  username: postgres
  password: password
  host: localhost
  port: 5432

production:
  primary: &primary_production
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>